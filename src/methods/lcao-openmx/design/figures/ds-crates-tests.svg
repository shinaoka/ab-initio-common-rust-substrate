<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="390" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#555"/></marker></defs>
  <text x="380" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Crates (built and tested bottom-up) and how each layer is tested</text>

  <!-- crates -->
  <g fill="#ffffff" stroke="#666">
    <rect x="40" y="300" width="110" height="36" rx="5"/>
    <rect x="190" y="300" width="110" height="36" rx="5"/>
    <rect x="115" y="236" width="110" height="36" rx="5"/>
    <rect x="40" y="172" width="110" height="36" rx="5"/>
    <rect x="190" y="172" width="110" height="36" rx="5"/>
    <rect x="40" y="108" width="110" height="36" rx="5"/>
    <rect x="190" y="108" width="110" height="36" rx="5"/>
    <rect x="190" y="50" width="110" height="36" rx="5"/>
  </g>
  <g text-anchor="middle" fill="#222" font-family="Menlo, monospace" font-size="12">
    <text x="95" y="323">comm</text>
    <text x="245" y="323">atomdata</text>
    <text x="170" y="259">structure</text>
    <text x="95" y="195">blocks</text>
    <text x="245" y="195">grid</text>
    <text x="95" y="131">twocenter</text>
    <text x="245" y="131">scf</text>
    <text x="245" y="73">cli</text>
  </g>
  <g stroke="#555" stroke-width="1.4" marker-end="url(#a)">
    <path d="M95 300 L150 274"/>
    <path d="M245 300 L190 274"/>
    <path d="M150 236 L105 210"/>
    <path d="M190 236 L235 210"/>
    <path d="M95 172 L95 146"/>
    <path d="M245 172 L245 146"/>
    <path d="M150 126 L188 126"/>
    <path d="M140 172 L205 146"/>
    <path d="M245 108 L245 88"/>
  </g>
  <text x="40" y="372" font-size="11" fill="#666">Crates are named sphaira-*. Arrows: "is used by". External: rsmpi-rt, pencil-rs, tenferro-rs, threadteam.</text>

  <!-- comm implementations -->
  <text x="340" y="64" font-weight="bold" fill="#333">One Comm trait, three implementations</text>
  <g stroke="#666">
    <rect x="340" y="76" width="125" height="58" rx="5" fill="#eef0f3"/>
    <rect x="475" y="76" width="125" height="58" rx="5" fill="#fff6d6"/>
    <rect x="610" y="76" width="125" height="58" rx="5" fill="#e3effb"/>
  </g>
  <g text-anchor="middle" fill="#222">
    <text x="402" y="98" font-family="Menlo, monospace" font-size="12">SelfComm</text>
    <text x="402" y="118" font-size="11">1 rank, no messages</text>
    <text x="537" y="98" font-family="Menlo, monospace" font-size="12">SimComm</text>
    <text x="537" y="118" font-size="11">P ranks as threads</text>
    <text x="672" y="98" font-family="Menlo, monospace" font-size="12">MpiComm</text>
    <text x="672" y="118" font-size="11">rsmpi-rt, mpirun</text>
  </g>

  <!-- test table -->
  <text x="340" y="168" font-weight="bold" fill="#333">Test layers</text>
  <g font-size="12" fill="#222">
    <rect x="340" y="178" width="395" height="28" fill="#f7f7f7" stroke="#ddd"/>
    <text x="350" y="197">Kernels: one block, one grid point (no Comm)</text>
    <rect x="340" y="206" width="395" height="28" fill="#ffffff" stroke="#ddd"/>
    <text x="350" y="225">Graphs and plans: every item has one owner (SimComm)</text>
    <rect x="340" y="234" width="395" height="28" fill="#f7f7f7" stroke="#ddd"/>
    <text x="350" y="253">Drivers: same result for P = 1, 2, 3, 5 (SimComm)</text>
    <rect x="340" y="262" width="395" height="28" fill="#ffffff" stroke="#ddd"/>
    <text x="350" y="281">Stages: inputs injected from reference fixtures (SelfComm)</text>
    <rect x="340" y="290" width="395" height="28" fill="#f7f7f7" stroke="#ddd"/>
    <text x="350" y="309">End to end: SCF vs reference, a few with MpiComm</text>
  </g>
  <text x="340" y="342" font-size="11" fill="#666">P larger than the number of atoms is always tested,</text><text x="340" y="357" font-size="11" fill="#666">so ranks with no work are exercised.</text>
</svg>
